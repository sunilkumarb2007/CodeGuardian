services:
  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    ports:
      - "8082:8082"

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    environment:
      SERVICES_PAYMENT_BASE_URL: http://payment-service:8082
    ports:
      - "8081:8081"
    depends_on:
      - payment-service

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      SERVICES_ORDER_BASE_URL: http://order-service:8081
    ports:
      - "8080:8080"
    depends_on:
      - order-service
