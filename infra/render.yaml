services:
  # 1. Frontend: React + Vite Static Site
  - type: web
    name: codeguardian-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: codeguardian-api
          property: host
      - key: VITE_BACKEND_ORIGIN
        value: http://127.0.0.1:8000

  # 2. Backend: FastAPI Web Service
  - type: web
    name: codeguardian-api
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codeguardian-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: AI_PROVIDER
        value: sarvam
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_MODEL
        value: sarvam-105b
      - key: GITHUB_TOKEN
        sync: false
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: codeguardian-web
          property: host

databases:
  # 3. Database: PostgreSQL Durable Storage
  - name: codeguardian-db
    databaseName: codeguardian_db
    user: codeguardian
    plan: free
